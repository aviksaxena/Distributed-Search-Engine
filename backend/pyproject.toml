[project]
name = "search-engine"
version = "1.0.0"
description = "Distributed web crawler and search engine with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "httpx==0.25.1",
    "beautifulsoup4==4.12.2",
    "elasticsearch==8.11.0",
    "redis==5.0.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "urllib3==2.1.0",
    "lxml==4.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
